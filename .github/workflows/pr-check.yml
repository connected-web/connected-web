name: PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/assets/**'
      - 'site/images/**'
      - '.github/workflows/pr-check.yml'
      - '.github/workflows/publish-packages-pr.yml'
      - '.github/workflows/publish-packages-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets-package-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node JS LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./packages/assets

      - name: Build assets package
        run: npm run build
        working-directory: ./packages/assets

      - name: Validate generated files
        run: |
          test -f ./packages/assets/dist/favicon.ico
          test -f ./packages/assets/dist/connected-web-gradient-large.png
          test -f ./packages/assets/dist/connected-web-flat-large.png
          test -f ./packages/assets/dist/connected-web-gradient-128.png
          test -f ./packages/assets/dist/connected-web-gradient-256.png
          test -f ./packages/assets/dist/connected-web-gradient-512.png
          test -f ./packages/assets/dist/connected-web-flat-128.png
          test -f ./packages/assets/dist/connected-web-flat-256.png
          test -f ./packages/assets/dist/connected-web-flat-512.png
          test -f ./packages/assets/dist/manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('./packages/assets/dist/manifest.json', 'utf8'));
          const requiredKeys = [
            'favicon',
            'gradientLarge',
            'gradient128',
            'gradient256',
            'gradient512',
            'flatLarge',
            'flat128',
            'flat256',
            'flat512'
          ];
          for (const key of requiredKeys) {
            if (!manifest.assets[key]) {
              throw new Error(`Missing manifest asset key: ${key}`);
            }
          }
          NODE

      - name: Dry run package publish
        run: npm pack --dry-run
        working-directory: ./packages/assets
